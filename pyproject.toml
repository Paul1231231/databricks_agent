[project]
name = "databricks-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "databricks-langchain>=0.23.0",
    "databricks-sql-connector>=4.10.0",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "openai>=3.59.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
databricks-agent = "databricks_agent:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
